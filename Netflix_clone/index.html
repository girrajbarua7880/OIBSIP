<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Netflix Clone</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Navbar -->
  <header class="navbar">
    <h1 class="logo">NETFLIX</h1>
    <button class="signin">Sign In</button>
  </header>

  <!-- Banner -->
  <section class="banner">

    <div class="overlay"></div>

    <div class="banner-content">
      <h1>Unlimited movies, TV shows and more</h1>
      <p>Watch anywhere. Cancel anytime.</p>
      <button class="btn">Get Started</button>
    </div>
  </section>

 
  <section class="row">
    <h2>Trending Now</h2>

    <div class="row-posters">
      <img src="https://m.media-amazon.com/images/I/8132wAUUPjL._AC_UF1000,1000_QL80_.jpg">
      <img src="https://m.media-amazon.com/images/I/8132wAUUPjL._AC_UF1000,1000_QL80_.jpg">
      <img src="https://lumiere-a.akamaihd.net/v1/images/image_b81e5aed.jpeg">
      <img src="https://upload.wikimedia.org/wikipedia/en/b/b2/ReturnOfTheJediPoster1983.jpg">
      <img src="https://m.media-amazon.com/images/I/8132wAUUPjL._AC_UF1000,1000_QL80_.jpg">
    </div>
  </section>
  <section class="row">
    <h2>Best movie</h2>

    <div class="row-posters">
      <img src="https://m.media-amazon.com/images/I/8132wAUUPjL._AC_UF1000,1000_QL80_.jpg">
      <img src="https://m.media-amazon.com/images/I/8132wAUUPjL._AC_UF1000,1000_QL80_.jpg">
      <img src="https://m.media-amazon.com/images/I/8132wAUUPjL._AC_UF1000,1000_QL80_.jpg">
      <img src="https://lumiere-a.akamaihd.net/v1/images/image_b81e5aed.jpeg">
      <img src="https://upload.wikimedia.org/wikipedia/en/b/b2/ReturnOfTheJediPoster1983.jpg">
      
    </div>
  </section>

</body>
</html>
