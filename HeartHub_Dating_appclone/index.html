<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeartHub</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">
  <header class="navbar">
    <div class="logo">❤️ HeartHub</div>

    <div class="search-box">
      <input type="text" placeholder="Search matches...">
    </div>

    <div class="nav-icons">
      <span>🔔</span>
      <span>💬</span>
      <span class="profile">👤</span>
    </div>
  </header>

  <div class="grid">

    <div class="card">
      <img src="https://randomuser.me/api/portraits/women/44.jpg">
      <div class="overlay"></div>
      <div class="info">
        <h3>Riya, 22</h3>
        <p>Delhi • Student</p>
        <div class="tags">
          <span>Travel</span>
          <span>Music</span>
        </div>
      </div>
    </div>

    <div class="card">
      <img src="https://randomuser.me/api/portraits/women/68.jpg">
      <div class="overlay"></div>
      <div class="info">
        <h3>Ananya, 24</h3>
        <p>Mumbai • Trainer</p>
        <div class="tags">
          <span>Gym</span>
          <span>Coffee</span>
        </div>
      </div>
    </div>

    <div class="card">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRugSHunimqetWALvN6YPS-dDRyISFC6PFI0Q&s">
      <div class="overlay"></div>
      <div class="info">
        <h3>Ajay, 21</h3>
        <p>Indore MP • Artist</p>
        <div class="tags">
          <span>Art</span>
          <span>Books</span>
        </div>
      </div>
    </div>

    <div class="card">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS6Hb5xzFZJCTW4cMqmPwsgfw-gILUV7QevvQ&s">
      <div class="overlay"></div>
      <div class="info">
        <h3>Neha, 23</h3>
        <p>Pune • Dancer</p>
        <div class="tags">
          <span>Dance</span>
          <span>Travel</span>
        </div>
      </div>
    </div>

  </div>

</div>

</body>
</html>
